# =============================================================================
# Panama Pacific coast surf spot seed - region pa-pacific
#
# HUMAN-OWNED. This file is edited ONLY by pull request, ONLY by a person.
# No machine path may ever write it (domain-model.md section 10, SpotDefinition
# invariant). Learned corrections live separately in learned/corrections/v1/
# and NEVER touch this file. Deleting a correction file reverts a spot to the
# values below.
#
# Content transcribed 2026-08-08 from
# docs/research/raw/14-panama-pacific-spot-seed-list.md (the coordinate
# research). Field names conform to docs/product/architecture/domain-model.md
# section 11 (spot-seed/1); the research's theta_n_deg is shore_normal_deg
# here, country_code is country, tide_pref is tide.optimum.
#
# Provenance rules, non-negotiable:
# - Every coordinate carries `confidence` (verified | single-source) and
#   `coord_source`. Definitions in data/spots/README.md.
# - shore_normal_deg is DERIVED on every row where present. No source anywhere
#   states a shore normal in degrees. Each row says how it was derived and how
#   uncertain it is. It drives the S_dir gate, so corrections to it matter.
# - Never add a spot, coordinate, or parameter without a citable source.
#
# Deliberately unseeded fields (null on every row, do not fill without a
# citable source):
# - h_ref_m, s_size, t_min_s: no source gives an optimal size or a scoring
#   reference height for any spot. Only Playa Cambutal has a sourced size
#   window (0.8-3.0 m, 15-16 s), kept in its notes, not converted.
# - wind_optimum: the S_wind scoring constants were never researched. The
#   researched fact is the offshore wind direction, carried per row as
#   offshore_wind_from_deg / offshore_wind_text.
# - tide.sigma: no source gives a numeric or comparable tide-window width.
#   Punta Brava's sourced "one hour either side of low" is in its tide_source.
# - tide_station: not researched; the tide adapter's fallback chain resolves
#   by lat/lon (domain-model.md section 11).
# - There is NO season field, on purpose. The one mass source for "best month"
#   (surf-forecast.com) conflates clean wind with rideable swell and labels
#   January "best" at spots its own data shows 100% too small in January.
#   Research 14, problem 3. Never import a season, consistency or star rating.
#
# Scope: DISCUSS decisions 15 (Pacific coast only) and 16 (well-known spots
# only, no secret breaks). Playa Duartes is deliberately absent - it could not
# be located under that name in any source. See README open questions.
# =============================================================================

schema: spot-seed/1

